        text: {}
    name:
      required: true
      selector:
        text: {}
mp3_list:
  name: Elenco MP3
  description: Legge file audio e suoni degli script (sola lettura).
  fields:
    device:
      required: true
      selector:
        text: {}
mp3_upload:
  name: Carica MP3
  description: Carica un MP3 precedentemente salvato in /config/awtrix_ng_audio/.
  fields:
    device:
      required: true
      selector:
        text: {}
    filename:
      required: true
      selector:
        text: {}
mp3_delete:
  name: Elimina MP3
  description: Elimina definitivamente un MP3 dalla cartella /MP3 del dispositivo.
  fields:
    device:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
mp3_rename:
  name: Rinomina MP3
  description: Rinomina un MP3 senza cambiare i suoni propri degli script.
  fields:
    device:
      required: true
      selector:
        text: {}
    old_name:
      required: true
      selector:
        text: {}
    new_name:
      required: true
      selector:
        text: {}
audio_play_source:
  name: Riproduci audio avanzato
  description: Riproduce una sola sorgente fra file, RTTTL, song, speech e stazione.
  fields:
    device:
      required: true
      selector:
        text: {}
    file:
      selector:
        text: {}
    rtttl:
      selector:
        text: {}
    song:
      selector:
        text: {}
    speech:
      selector:
        text: {}
    station:
      selector:
        text: {}
    loop:
      selector:
        boolean: {}
audio_stop_group:
  name: Ferma gruppo audio
  description: Ferma solo alert, suoni delle app o radio.
  fields:
    device:
      required: true
      selector:
        text: {}
    group:
      required: true
      selector:
        select:
          options:
            - alert
            - app
            - radio

# Device maintenance and ambient light (v0.6.2)
device_info:
  name: Device information
  description: Read firmware version, memory, uptime and current app.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}
system_info:
  name: System configuration
  description: Read system settings from the AWTRIX device.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}
device_logs:
  name: Device logs
  description: Retrieve logs from the AWTRIX device.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}
device_capabilities:
  name: Device capabilities
  description: Read available effects, transitions, overlays, sensors and audio.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}
moodlight_set:
  name: Set ambient light
  description: Set full-screen ambient color, white temperature or brightness.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}
    color:
      example: "#FF5500"
      selector:
        text: {}
    kelvin:
      selector:
        number:
          min: 1000
          max: 40000
          step: 100
    brightness:
      selector:
        number:
          min: 0
          max: 255
          step: 1
moodlight_off:
  name: Turn off ambient light
  description: Disable ambient light and restore normal application display.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}

# Advanced visual effects (v0.6.3)
visual_capabilities:
  name: Available visual effects
  description: Read effects, transitions, overlays and palettes supported by this device.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
visual_effect_app:
  name: Show animated pushed app
  description: Create or update a pushed app with animated background and optional overlay.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    name:
      required: true
      example: demo_fx
      selector: {text: {}}
    text:
      required: true
      example: HELLO
      selector: {text: {}}
    effect:
      example: Pacifica
      selector: {text: {}}
    effect_speed:
      example: 0.5
      selector: {number: {min: 0.1, max: 10, step: 0.1, mode: box}}
    palette:
      example: Ocean
      selector: {text: {}}
    overlay:
      example: snow
      selector: {text: {}}
    duration_ms:
      example: 7000
      selector: {number: {min: 100, max: 3600000, step: 100, mode: box}}
    show_immediately:
      name: Show immediately
      description: Display the pushed app immediately, without enabling rotation.
      selector: {boolean: {}}
    enable_rotation:
      name: Enable automatic rotation
      description: Enable global automatic rotation after creating the app (does not disable it when false).
      selector: {boolean: {}}
visual_overlay_global:
  name: Set global weather overlay
  description: Show rain, snow or other weather animation over applications. Use none to turn off.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    overlay:
      required: true
      example: rain
      selector: {text: {}}
    speed:
      example: 0.5
      selector: {number: {min: 0.1, max: 10, step: 0.1, mode: box}}
    palette:
      example: Ocean
      selector: {text: {}}
visual_transition:
  name: Set app transition animation
  description: Select the animation and duration used between applications.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    effect:
      required: true
      example: Pixelate
      selector: {text: {}}
    duration_ms:
      required: true
      example: 600
      selector: {number: {min: 0, max: 10000, step: 100, mode: box}}

# Application management (v0.6.4)
app_list_http:
  name: List applications
  description: Return all apps with enabled, present and rotation status.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
app_show_http:
  name: Show application
  description: Display an application immediately without changing global rotation settings.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    name:
      required: true
      example: demo_fx
      selector: {text: {}}
    fast:
      name: Without transition
      selector: {boolean: {}}
# Asset file management / Gestione file (v0.6.5)
file_list:
  name: List files / Elenca file
  description: List asset files and storage usage / Elenca i file e lo spazio utilizzato.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    folder:
      required: true
      selector:
        select:
          options: [ICONS, MELODIES, PALETTES, MP3]
file_upload:
  name: Upload file / Carica file
  description: Upload from /config/awtrix_ng_files/FOLDER/filename.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    folder:
      required: true
      selector:
        select:
          options: [ICONS, MELODIES, PALETTES, MP3]
    filename:
      required: true
      example: ocean.txt
      selector: {text: {}}
file_download:
  name: Download file / Scarica file
  description: Save in /config/awtrix_ng_downloads/FOLDER/filename without overwriting.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    folder:
      required: true
      selector:
        select:
          options: [ICONS, MELODIES, PALETTES, MP3]
    filename:
      required: true
      example: ocean.txt
      selector: {text: {}}
file_delete:
  name: Delete file / Elimina file
  description: Permanently delete one asset from AWTRIX / Elimina un file dal dispositivo.
  fields:
    device:
      required: true
      example: tc002
      selector: {text: {}}
    folder:
      required: true
      selector:
        select:
          options: [ICONS, MELODIES, PALETTES, MP3]
    filename:
      required: true
      example: ocean.txt
      selector: {text: {}}

backup_create:
  name: Create device backup
  description: Export supported media and optional non-secret settings and script sources to a verified local ZIP.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}
    name:
      required: true
      example: tc002_backup_01
      selector:
        text: {}
    folders:
      example: [ICONS, MELODIES, PALETTES, MP3]
      selector:
        select:
          multiple: true
          options:
            - ICONS
            - MELODIES
            - PALETTES
            - MP3
    settings:
      selector:
        boolean: {}
    scripts:
      selector:
        boolean: {}
backup_inspect:
  name: Inspect backup
  description: Validate ZIP checksums without changing the device.
  fields:
    name:
      required: true
      example: tc002_backup_01
      selector:
        text: {}
backup_restore_files:
  name: Restore backup files
  description: Restore only absent media files in one selected folder; never overwrite existing files.
  fields:
    device:
      required: true
      example: tc002
      selector:
        text: {}
    name:
      required: true
      example: tc002_backup_01
      selector:
        text: {}
    folder:
      required: true
      selector:
        select:
          options: [ICONS, MELODIES, PALETTES, MP3]
    confirm:
      required: true
      selector:
        boolean: {}

backup_restore_script:
  name: Restore Berry script
  description: Install a Berry script from an integration backup only if not present, optionally restoring saved options. No overwrites.
  fields:
    device:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
    script:
      required: true
      selector:
        text: {}
    confirm:
      required: true
      selector:
        boolean: {}
    restore_options:
      selector:
        boolean: {}
backup_restore_settings:
  name: Restore safe display settings
  description: Restore approved display settings only. Excludes network, passwords, MQTT and system settings.
  fields:
    device:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
    confirm:
      required: true
      selector:
        boolean: {}

# Maintenance / Manutenzione (v0.6.8)
device_health:
  name: Device health / Diagnostica dispositivo
  description: Read device state, display and network statistics without changing any setting. / Legge stato e diagnostica senza modifiche.
  fields:
    device:
      name: Device / Dispositivo
      required: true
      example: tc002
      selector: {text: {}}
device_reboot:
  name: Reboot device / Riavvia dispositivo
  description: Restart AWTRIX NG; explicit confirmation is required. / Riavvia AWTRIX NG con conferma obbligatoria.
  fields:
    device:
      name: Device / Dispositivo
      required: true
      example: tc002
      selector: {text: {}}
    confirm:
      name: Confirm / Conferma
      required: true
      selector: {boolean: {}}
