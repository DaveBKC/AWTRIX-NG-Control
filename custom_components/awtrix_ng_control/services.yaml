  description: Invia un payload JSON AWTRIX NG sul display.
  fields:
    device:
      name: Dispositivo
      description: Prefisso MQTT, ad esempio tc002, oppure ID entry.
      required: true
      selector:
        text: {}
    data:
      name: Dati notifica
      required: true
      selector:
        object: {}
dismiss:
  name: Chiudi notifica
  description: Chiude la notifica attiva.
  fields:
    device:
      name: Dispositivo
      description: Prefisso MQTT, ad esempio tc002, oppure ID entry.
      required: true
      selector:
        text: {}
dismiss_named:
