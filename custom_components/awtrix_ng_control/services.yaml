      required: true
      selector:
        select:
          options: [GET, POST, PUT, PATCH, DELETE]
    path:
      required: true
      selector:
        text: {}
    data:
      selector:
        object: {}

notify_simple:
  name: Notifica rapida
  description: Mostra testo, icona, colore e suono senza scrivere JSON.
  fields:
    device:
      required: true
      selector: {text: {}}
    message:
      required: true
      selector: {text: {}}
    duration:
      name: Durata (secondi)
      default: 10
      selector:
        number: {min: 1, max: 600, mode: box}
    icon:
      selector: {text: {}}
    color:
      selector: {text: {}}
    sound:
      selector: {text: {}}
indicator_set:
  name: Imposta indicatore
  description: Imposta uno dei tre LED indicatori con il payload JSON ufficiale.
  fields:
    device:
      required: true
      selector: {text: {}}
    indicator:
      required: true
      selector:
        number: {min: 1, max: 3, mode: box}
    data:
      required: true
      example: {on: true, color: "#00FF00"}
      selector: {object: {}}
indicator_clear:
  name: Spegni indicatore
  description: Spegne uno dei tre LED indicatori.
  fields:
    device:
      required: true
      selector: {text: {}}
    indicator:
      required: true
      selector:
        number: {min: 1, max: 3, mode: box}

app_refresh:
  name: Aggiorna applicazioni
  description: Rilegge le applicazioni e aggiorna il menu senza riavviare Home Assistant.
  fields:
    device:
      required: true
      selector: {text: {}}
app_set_enabled:
  name: Abilita o disabilita applicazione
  description: Modifica lo stato di una sola app senza alterare le altre.
  fields:
    device:
      required: true
      selector: {text: {}}
    name:
      name: Nome applicazione
      required: true
      selector: {text: {}}
    enabled:
      name: Abilitata
      required: true
      selector: {boolean: {}}
app_set_order:
  name: Ordina applicazioni in rotazione
  description: Richiede tutte le app attualmente nella rotazione una sola volta; mantiene le app disabilitate.
  fields:
    device:
      required: true
      selector: {text: {}}
    order:
      name: Elenco ordinato
      description: Lista YAML dei nomi delle app attualmente in rotazione, senza ometterne nessuna.
      required: true
      selector: {object: {}}

icon_list:
  name: Elenca icone
  description: Restituisce l'elenco delle icone installate sul display e lo spazio utilizzato. Usa un'azione con risposta.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}

icon_upload:
  name: Carica icona
  description: Carica una GIF/JPEG presente in /config/www/awtrix_icons sul dispositivo.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    filename:
      name: File GIF o JPEG
      required: true
      selector:
        text: {}

icon_rename:
  name: Rinomina icona
  description: Rinomina un'icona esistente senza cambiare l'estensione.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    old_name:
      name: Nome corrente
      required: true
      selector:
        text: {}
    new_name:
      name: Nuovo nome
      required: true
      selector:
        text: {}

icon_delete:
  name: Elimina icona
  description: Elimina definitivamente un'icona dal display.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Nome file icona
      required: true
      selector:
        text: {}

notification_advanced:
  name: Notifica avanzata (HTTP)
  description: Invia una notifica completa, anche con layout a regioni e nome, validata dal firmware AWTRIX NG.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    data:
      name: Payload notifica
      description: Oggetto JSON con text oppure layout, durata, suono, hold, stack, wakeup e nome.
      required: true
      selector:
        object: {}
notification_dismiss_named_http:
  name: Cancella notifica per nome (HTTP)
  description: Rimuove una notifica identificata per nome, anche dalla coda.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Nome notifica
      required: true
      selector:
        text: {}

script_list:
  name: Elenca script Berry
  description: Legge gli script installati e i relativi errori.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}

script_read:
  name: Leggi script Berry
  description: Restituisce il sorgente Berry installato.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}

script_install:
  name: Installa script Berry
  description: Installa un nuovo script Berry da /config/awtrix_ng_scripts, senza sovrascrivere nomi esistenti.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}
    filename:
      name: Filename
      required: true
      selector:
        text: {}

script_update:
  name: Aggiorna script Berry
  description: Aggiorna uno script solo se il sorgente remoto non è cambiato (scriptUpdates).
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}
    filename:
      name: Filename
      required: true
      selector:
        text: {}

script_remove:
  name: Elimina script Berry
  description: ELIMINA lo script e i suoi dati persistenti; i file audio rimangono.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}

script_config_get:
  name: Leggi impostazioni script
  description: Legge i parametri configurabili Berry.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}

script_config_set:
  name: Imposta parametri script
  description: Modifica alcuni parametri, lasciando invariati gli altri.
  fields:
    device:
      name: Dispositivo
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}
    settings:
      name: Settings
      required: true
      selector:
        object: {}

audio_status:
  name: Stato audio
  description: Legge radio, alert e audio delle app (sola lettura).
  fields:
    device:
      required: true
      selector:
        text: {}
melody_list:
  name: Elenco melodie
  description: Restituisce melodie RTTTL e relative informazioni (sola lettura).
  fields:
    device:
      required: true
      selector:
        text: {}
melody_save:
  name: Salva melodia RTTTL
  description: Crea o sostituisce una melodia presente sul dispositivo.
  fields:
    device:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
